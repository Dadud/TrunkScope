name: trunkscope-receiver
services:
  soapy-remote:
    build:
      context: ../..
      dockerfile: deploy/receiver-node/Dockerfile
    network_mode: host
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      SOAPYREMOTE_BIND: ${SOAPYREMOTE_BIND:-0.0.0.0:55132}
    command: ["--bind", "${SOAPYREMOTE_BIND:-0.0.0.0:55132}"]
    restart: unless-stopped

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:sdrplay-api]
command=/bin/sh -c 'if [ -x /opt/sdrplay/sdrplay_apiService ]; then exec /opt/sdrplay/sdrplay_apiService; else exit 0; fi'
autostart=true
autorestart=true
startsecs=30
startretries=10
priority=10
stopwaitsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:control-plane]
command=/usr/local/bin/trunkscope-control-plane
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:decoder]
command=/usr/local/bin/run-decoder.sh
autostart=true
autorestart=true
startsecs=5
priority=20
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
